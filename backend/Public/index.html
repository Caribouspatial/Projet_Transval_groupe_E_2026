<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Quiz Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-primary mb-4">Quiz Admin</h1>

    <form id="questionForm" class="card p-3 mb-4">
        <input name="question" class="form-control mb-2" placeholder="Question" required />

        <input name="a" class="form-control mb-2" placeholder="A" required />
        <input name="b" class="form-control mb-2" placeholder="B" required />
        <input name="c" class="form-control mb-2" placeholder="C" required />
        <input name="d" class="form-control mb-2" placeholder="D" required />

        <input name="answer" class="form-control mb-3" placeholder="Bonne réponse" required />

        <button class="btn btn-primary">Envoyer</button>
    </form>

    <h3>⏳ En attente</h3>
    <div id="pendingContainer"></div>

    <h3 class="mt-4">✔ Validées</h3>
    <div id="questionsContainer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
