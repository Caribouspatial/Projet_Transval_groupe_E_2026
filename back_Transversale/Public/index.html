<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Quiz Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-primary">Ajouter une question</h1>

    <form id="questionForm" class="card p-3 shadow-sm">

        <input name="question" class="form-control mb-2" placeholder="Question" required />

        <input name="a" class="form-control mb-2" placeholder="Réponse A" required />
        <input name="b" class="form-control mb-2" placeholder="Réponse B" required />
        <input name="c" class="form-control mb-2" placeholder="Réponse C" required />
        <input name="d" class="form-control mb-2" placeholder="Réponse D" required />

        <input name="answer" class="form-control mb-2" placeholder="Bonne réponse" required />

        <button type="submit" class="btn btn-primary">
            Envoyer
        </button>
    </form>

    <hr>

    <h2>Questions</h2>
    <div id="questionsContainer" class="row"></div>

</div>

<script src="script.js"></script>

</body>
</html>
